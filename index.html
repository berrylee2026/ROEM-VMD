function comp(file,mw,q,cb){
  var r=new FileReader();
  r.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var c=document.createElement("canvas"),w=img.width,h=img.height;
      if(w>mw){h=Math.round(h*mw/w);w=mw;}
      c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
      cb(c.toDataURL("image/jpeg",q));
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}

function movePin(pid, dir){
  if(!isA)return;
  var pids=Object.keys(iPins);
  var idx=pids.indexOf(pid);
  if(idx===-1)return;
  var newIdx=idx+dir;
  if(newIdx<0||newIdx>=pids.length)return;
  // 두 핀의 모든 데이터 swap
  var a=pids[idx], b=pids[newIdx];
  var tmpA=JSON.parse(JSON.stringify(iPins[a]));
  var tmpB=JSON.parse(JSON.stringify(iPins[b]));
  iPins[a]=tmpB;
  iPins[b]=tmpA;
  sImpl();
}

function sTDrag(e,pid){if(!isA||!movM)return;e.preventDefault();var t=e.touches[0];dragId=pid;dsx=t.clientX;dsy=t.clientY;dpx=iPins[pid].x;dpy=iPins[pid].y;}
function cwM(e){if(!dragId)return;var w=document.getElementById("cw"),r=w.getBoundingClientRect();iPins[dragId].x=Math.min(100,Math.max(0,dpx+(e.clientX-dsx)/r.width*100));iPins[dragId].y=Math.min(100,Math.max(0,dpy+(e.clientY-dsy)/r.height*100));var pe=document.getElementById("vp_"+dragId);if(pe){pe.style.left=iPins[dragId].x+"%";pe.style.top=iPins[dragId].y+"%";}}
function cwTM(e){if(!dragId)return;e.preventDefault();var t=e.touches[0],w=document.getElementById("cw"),r=w.getBoundingClientRect();iPins[dragId].x=Math.min(100,Math.max(0,dpx+(t.clientX-dsx)/r.width*100));iPins[dragId].y=Math.min(100,Math.max(0,dpy+(t.clientY-dsy)/r.height*100));var pe=document.getElementById("vp_"+dragId);if(pe){pe.style.left=iPins[dragId].x+"%";pe.style.top=iPins[dragId].y+"%";}}
function cwU(){if(!dragId)return;sImpl();dragId=null;}

var entryPin = "";
var USER_PIN = "1234";
var ADMIN_PIN_ENTRY = "2026";

function epk(k){
  if(k===-1){entryPin=entryPin.slice(0,-1);eUpdateDots();return;}
  if(entryPin.length>=4)return;
  entryPin+=String(k);eUpdateDots();
  if(entryPin.length===4)setTimeout(eCheckPin,120);
}
function eUpdateDots(){
  for(var i=0;i<4;i++){
    var d=document.getElementById("ed"+i);
    if(d){d.classList.toggle("on",i<entryPin.length);d.classList.remove("er");}
  }
}
function eCheckPin(){
  if(entryPin===ADMIN_PIN_ENTRY){
    isA=true;
    document.getElementById("entry-screen").classList.add("hidden");
    applyA();
  } else if(entryPin===USER_PIN){
    isA=false;
    document.getElementById("entry-screen").classList.add("hidden");
    applyA();
  } else {
    for(var i=0;i<4;i++){var d=document.getElementById("ed"+i);if(d)d.classList.add("er");}
    document.getElementById("entry-err").textContent="PIN이 올바르지 않아요";
    setTimeout(function(){entryPin="";eUpdateDots();document.getElementById("entry-err").textContent="";},900);
  }
}

    });
  }
  // 추가 사진 버튼
  var addBar=el("div","add-photo-bar");
  var addInp=el("input","add-photo-input");addInp.id="extra-name-"+sid;addInp.placeholder="추가 사진 이름 (예: FACE2, FACE3...)";
  var addBtn=el("button","add-photo-btn");addBtn.textContent="+ 사진 추가";
  (function(sid){addBtn.onclick=function(){addExtraPhoto(sid);};})(sid);
  addBar.appendChild(addInp);addBar.appendChild(addBtn);
  zcs.appendChild(addBar);
}

    var right=el("div");right.style.cssText="display:flex;align-items:center;gap:7px";var bb=el("div","bb");var bf=el("div","bf");bf.style.width=pct+"%";bb.appendChild(bf);var pc=el("span","pct");pc.textContent=pct+"%";var ar=el("span","ar");ar.textContent="›";right.appendChild(bb);right.appendChild(pc);right.appendChild(ar);sr.appendChild(right);
